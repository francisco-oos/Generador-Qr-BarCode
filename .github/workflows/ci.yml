name: marking-studio-ci
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: marking-studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config libzbar0
      - if: runner.os == 'macOS'
        run: |
          brew install cairo pkg-config zbar
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix zbar)/lib:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix zbar)/lib/pkgconfig:$(brew --prefix cairo)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node --check app/static/laser_design.js
      - run: python scripts/compatibility_check.py
