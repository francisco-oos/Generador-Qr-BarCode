[project]
name = "server-oficina-marking-studio"
version = "0.10.0"
description = "Marking Studio, Laser Design Studio y control GRBL experimental para identificación y fabricación láser"
requires-python = ">=3.12"
license = {text = "Proprietary - internal evaluation"}
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "reportlab==4.4.9",
  "qrcode==8.2",
  "Pillow==12.3.0",
  "svglib==1.6.0",
  "cryptography==46.0.4",
  "python-multipart==0.0.29",
  "pyserial==3.5",
  "pyzbar==0.1.9",
  "openpyxl==3.1.5",
  "shapely==2.1.2",
  "fonttools>=4,<5"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
